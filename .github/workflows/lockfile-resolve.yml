# Temporary read-only lockfile resolver. Remove this file from the PR after
# importing the generated package.json + bun.lock artifact.
name: Resolve Svelte dependency patches (temporary)
on:
  push:
    branches:
      - maintenance/svelte-patches-20261103
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Resolve three compatible patches with Bun
        run: bun add --dev --exact @sveltejs/kit@3.1.1 @sveltejs/adapter-static@4.0.1 svelte-check@4.7.8
      - name: Confirm reproducible installation
        run: bun install --frozen-lockfile
      - name: Typecheck, unit tests, and production build
        run: |
          bun run check
          bun test src/lib
          bun run build
      # Read-only transport back to the GitHub connector. Package manifest and
      # lockfile contain public dependency metadata only; no tokens/secrets.
      - name: Emit exact generated files for import
        run: |
          echo "BUN_PACKAGE_JSON_B64:$(base64 -w0 package.json)"
          echo "BUN_LOCK_B64:$(base64 -w0 bun.lock)"
      - name: Upload generated manifest and lockfile
        uses: actions/upload-artifact@v4
        with:
          name: svelte-patches-bun-lock
          path: |
            package.json
            bun.lock
          retention-days: 2
