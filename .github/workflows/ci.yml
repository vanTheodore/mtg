name: Mesa CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4
  RUST_TOOLCHAIN: nightly-2025-03-02

jobs:
  static:
    name: Typecheck, unit tests and static build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR checkout is a synthetic merge commit. Fetch its base to
          # compare the entire actual PR diff, including changes from forks.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Classify changed paths (main always full; PR fail-closed)
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun scripts/ci-change-scope.ts
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Phase source provenance
        run: bun run engine:verify
      - run: bun run check
      - run: bun test src/lib
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: static-build
          path: build
          retention-days: 7

  wasm:
    name: WASM build (pinned Rust and lockfile)
    needs: [static]
    if: needs.static.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target-wasm"
          shared-key: mesa-wasm-${{ hashFiles('Cargo.lock', 'crates/mtg-engine-wasm/**') }}
      - name: Validate Cargo.lock with pinned Rust
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Build Phase bridge with precompiled wasm32 std
        env:
          CARGO_TARGET_DIR: target-wasm
          CARGO_LOCKED: "1"
        run: |
          set -o pipefail
          bun run engine:build 2>&1 | tee /tmp/wasm-build.log
      # Cargo's failure is an exit code plus a job log behind a blob download
      # that is unreachable on some networks; the annotation is plain JSON.
      - name: Annotate Rust errors
        if: failure()
        run: bun scripts/rust-annotations.ts /tmp/wasm-build.log
      - name: Record artifact identity
        run: |
          set -euo pipefail
          WASM=static/wasm/mtg_engine_wasm.wasm
          test -s "$WASM"
          sha256sum "$WASM" | tee static/wasm/mtg_engine_wasm.wasm.sha256
          sha256sum Cargo.lock | tee static/wasm/Cargo.lock.sha256
          rustc -Vv | tee static/wasm/rustc-version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mtg-engine-wasm
          path: static/wasm
          retention-days: 7
  native-integration:
    name: Native parity and explicit mechanics scenarios
    needs: [static]
    if: needs.static.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target-native"
          shared-key: mesa-native-${{ hashFiles('Cargo.lock', 'crates/**') }}
      - run: bun install --frozen-lockfile
      - name: Direct Phase API vs wrapper ABI
        env:
          CARGO_TARGET_DIR: target-native
        run: |
          set -o pipefail
          bun run engine:parity 2>&1 | tee /tmp/parity.log
      - name: Explicit mana, casting, combat, target, trigger and endgame scenarios
        env:
          CARGO_TARGET_DIR: target-native
        run: |
          set -o pipefail
          bun run engine:scenarios 2>&1 | tee /tmp/scenarios.log
      - name: Annotate Rust errors
        if: failure()
        run: |
          bun scripts/rust-annotations.ts /tmp/parity.log
          bun scripts/rust-annotations.ts /tmp/scenarios.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-reports
          path: |
            docs/parity-report.json
            docs/scenarios-report.json
          if-no-files-found: warn
          retention-days: 7

  browser:
    name: Chromium integration and visual interaction
    needs: [wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun --bun playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: mtg-engine-wasm
          path: static/wasm
      # The JSON report feeds the annotation step below: the directory names
      # alone say which test broke, the message says why. `list` keeps the
      # readable console output.
      - run: bun --bun playwright test --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/report.json
      # The HTML report, the traces and the job log live behind an artifact
      # download that some networks cannot reach; annotations are plain JSON on
      # the API, so every failure is repeated there with its error message.
      - name: Annotate failing Playwright tests
        if: failure()
        run: bun scripts/e2e-annotations.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results
            docs/performance.json
          if-no-files-found: warn
          retention-days: 7
