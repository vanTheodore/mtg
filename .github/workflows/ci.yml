name: Mesa CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4
  RUST_TOOLCHAIN: nightly-2025-03-02

jobs:
  static:
    name: Typecheck, unit tests and static build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Phase source provenance
        run: bun run engine:verify
      - run: bun run check
      - run: bun test src/lib
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: static-build
          path: build
          retention-days: 7

  wasm:
    name: WASM build (pinned Rust and lockfile)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target-wasm"
          shared-key: mesa-wasm-${{ hashFiles('Cargo.lock', 'crates/mtg-engine-wasm/**') }}
      - name: Validate Cargo.lock with pinned Rust
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Build Phase bridge with precompiled wasm32 std
        env:
          CARGO_TARGET_DIR: target-wasm
          CARGO_LOCKED: "1"
        run: bun run engine:build
      - name: Record artifact identity
        run: |
          set -euo pipefail
          WASM=static/wasm/mtg_engine_wasm.wasm
          test -s "$WASM"
          sha256sum "$WASM" | tee static/wasm/mtg_engine_wasm.wasm.sha256
          sha256sum Cargo.lock | tee static/wasm/Cargo.lock.sha256
          rustc -Vv | tee static/wasm/rustc-version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mtg-engine-wasm
          path: static/wasm
          retention-days: 7
      # The same binary, published on a branch of its own, so the Chromium
      # suite can also be run outside GitHub Actions (the artifacts of a run
      # cannot be downloaded from every environment). It is written only once:
      # the engine does not change while this branch is being reviewed.
      - name: Publish the engine build for local runs
        if: always()
        run: |
          set -euo pipefail
          test -s static/wasm/mtg_engine_wasm.wasm
          wanted=$(cut -d' ' -f1 static/wasm/mtg_engine_wasm.wasm.sha256)
          published=""
          if git ls-remote --exit-code --heads origin ci/wasm-mirror > /dev/null 2>&1; then
            git fetch --depth=1 origin ci/wasm-mirror:refs/remotes/origin/ci/wasm-mirror
            published=$(git show refs/remotes/origin/ci/wasm-mirror:wasm/mtg_engine_wasm.wasm.sha256 2>/dev/null | cut -d' ' -f1 || true)
          fi
          if [ "$published" = "$wanted" ]; then
            echo "ci/wasm-mirror ya tiene este binario: no se vuelve a publicar."
            exit 0
          fi
          git config user.name "mesa-ci"
          git config user.email "mesa-ci@users.noreply.github.com"
          git checkout --orphan ci/wasm-mirror
          rm -rf .git/index
          mkdir -p wasm
          cp -f static/wasm/mtg_engine_wasm.wasm wasm/
          cp -f static/wasm/mtg_engine_wasm.wasm.sha256 wasm/ 2>/dev/null || true
          cp -f static/wasm/Cargo.lock.sha256 wasm/ 2>/dev/null || true
          cp -f static/wasm/rustc-version.txt wasm/ 2>/dev/null || true
          git add -f wasm
          git commit -m "engine: binario WASM de Phase para la suite de navegador" --allow-empty
          git push --force origin ci/wasm-mirror

  native-integration:
    name: Native parity and explicit mechanics scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target-native"
          shared-key: mesa-native-${{ hashFiles('Cargo.lock', 'crates/**') }}
      - run: bun install --frozen-lockfile
      - name: Direct Phase API vs wrapper ABI
        env:
          CARGO_TARGET_DIR: target-native
        run: bun run engine:parity
      - name: Explicit mana, casting, combat, target, trigger and endgame scenarios
        env:
          CARGO_TARGET_DIR: target-native
        run: bun run engine:scenarios
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-reports
          path: |
            docs/parity-report.json
            docs/scenarios-report.json
          if-no-files-found: warn
          retention-days: 7

  browser:
    name: Chromium integration and visual interaction
    needs: [wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun --bun playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: mtg-engine-wasm
          path: static/wasm
      - run: bun --bun playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results
            docs/performance.json
          if-no-files-found: warn
          retention-days: 7
