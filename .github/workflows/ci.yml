name: Mesa CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4
  RUST_TOOLCHAIN: nightly-2025-03-02

jobs:
  static:
    name: Typecheck, unit tests and static build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR checkout is a synthetic merge commit. Fetch its base to
          # compare the entire actual PR diff, including changes from forks.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Classify changed paths (main always full; PR fail-closed)
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun scripts/ci-change-scope.ts
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Phase source provenance
        run: bun run engine:verify
      - run: bun run check
      - run: bun test src/lib
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: static-build
          path: build
          retention-days: 7

  wasm:
    name: WASM build (pinned Rust and lockfile)
    needs: [static]
    if: needs.static.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target-wasm"
          shared-key: mesa-wasm-${{ hashFiles('Cargo.lock', 'crates/mtg-engine-wasm/**') }}
      - name: Validate Cargo.lock with pinned Rust
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Build Phase bridge with precompiled wasm32 std
        env:
          CARGO_TARGET_DIR: target-wasm
          CARGO_LOCKED: "1"
        run: |
          set -o pipefail
          bun run engine:build 2>&1 | tee /tmp/wasm-build.log
      - name: Verify production WASM rejects scenario restore
        run: bun run engine:verify-no-e2e-op
      - name: Record production artifact identity
        run: |
          set -euo pipefail
          WASM=static/wasm/mtg_engine_wasm.wasm
          test -s "$WASM"
          sha256sum "$WASM" | tee static/wasm/mtg_engine_wasm.wasm.sha256
          sha256sum Cargo.lock | tee static/wasm/Cargo.lock.sha256
          rustc -Vv | tee static/wasm/rustc-version.txt
      - name: Build isolated GameScenario E2E bridge
        env:
          CARGO_TARGET_DIR: target-wasm
          CARGO_LOCKED: "1"
          ENGINE_FEATURES: e2e-scenarios
          ENGINE_WASM_OUT: static/wasm-e2e/mtg_engine_wasm_e2e.wasm
        run: |
          set -o pipefail
          bun run engine:build 2>&1 | tee /tmp/wasm-e2e-build.log
      - name: Verify separated WASM artifacts
        run: |
          test -s static/wasm/mtg_engine_wasm.wasm
          test -s static/wasm-e2e/mtg_engine_wasm_e2e.wasm
      # Cargo's failure is an exit code plus a job log behind a blob download
      # that is unreachable on some networks; annotate both builds when present.
      - name: Annotate Rust errors
        if: failure()
        run: |
          test ! -s /tmp/wasm-build.log || bun scripts/rust-annotations.ts /tmp/wasm-build.log
          test ! -s /tmp/wasm-e2e-build.log || bun scripts/rust-annotations.ts /tmp/wasm-e2e-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: mtg-engine-wasm
          path: static/wasm
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: mtg-engine-wasm-e2e
          path: static/wasm-e2e/mtg_engine_wasm_e2e.wasm
          retention-days: 7
  native-integration:
    name: Native parity and explicit mechanics scenarios
    needs: [static]
    if: needs.static.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target-native"
          shared-key: mesa-native-${{ hashFiles('Cargo.lock', 'crates/**') }}
      - run: bun install --frozen-lockfile
      - name: Direct Phase API vs wrapper ABI
        env:
          CARGO_TARGET_DIR: target-native
        run: |
          set -o pipefail
          bun run engine:parity 2>&1 | tee /tmp/parity.log
      - name: Explicit mana, casting, combat, target, trigger and endgame scenarios
        env:
          CARGO_TARGET_DIR: target-native
        run: |
          set -o pipefail
          bun run engine:scenarios 2>&1 | tee /tmp/scenarios.log
      - name: Prepare isolated Phase GameScenario fixtures for browser E2E
        env:
          CARGO_TARGET_DIR: target-native
          CARGO_LOCKED: "1"
          MESA_E2E_SCENARIOS_DIR: static/e2e-scenarios
        run: |
          set -o pipefail
          bun run e2e:scenarios 2>&1 | tee /tmp/e2e-scenarios.log
      - name: Annotate GameScenario generator errors
        if: failure()
        run: |
          test ! -s /tmp/e2e-scenarios.log || bun scripts/rust-annotations.ts /tmp/e2e-scenarios.log
          if test -s /tmp/e2e-scenarios.log; then
            grep -E 'panicked|Phase rejected|assertion failed|error\[|error:|generating fixture' /tmp/e2e-scenarios.log \
              | tail -25 | while IFS= read -r line; do echo "::error::$line"; done
          fi
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-scenarios-generator-log
          path: /tmp/e2e-scenarios.log
          if-no-files-found: warn
      - name: Annotate Rust errors
        if: failure()
        run: |
          bun scripts/rust-annotations.ts /tmp/parity.log
          bun scripts/rust-annotations.ts /tmp/scenarios.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-reports
          path: |
            docs/parity-report.json
            docs/scenarios-report.json
          if-no-files-found: warn
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-scenario-fixtures
          path: static/e2e-scenarios
          if-no-files-found: warn
          retention-days: 7

  # Fast, same-run browser regressions run before Chromium's full serial suite.
  # A focused failure stops the dependency chain, so a hypothesis never spends
  # the 90-minute browser budget before the affected contracts are green.
  target_priority_sync:
    name: Focused · UX-PRIORITY synchronization and handoff contracts
    needs: [static, wasm, native-integration]
    if: needs.static.outputs.heavy == 'true'
    uses: ./.github/workflows/e2e-regression.yml
    with:
      job_name: UX-PRIORITY state sync, boundary pass and Resolve All
      specs: tests/e2e/ux-priority.spec.ts
      artifact_name: failed-ux-priority-regressions

  target_double_dispatch:
    name: Focused · one dispatch per double activation
    needs: [static, wasm, native-integration]
    if: needs.static.outputs.heavy == 'true'
    uses: ./.github/workflows/e2e-regression.yml
    with:
      job_name: Double-dispatch identity and Worker contract
      specs: |
        tests/e2e/ux-decision.spec.ts
        tests/e2e/arena-hand-sheet.spec.ts
      grep: 'cancelación y busy|doble pulsación produce exactamente un despacho aceptado'
      artifact_name: failed-double-dispatch-regressions

  target_ux_hand:
    name: Focused · UX-HAND launch and rejection contracts
    needs: [static, wasm, native-integration]
    if: needs.static.outputs.heavy == 'true'
    uses: ./.github/workflows/e2e-regression.yml
    with:
      job_name: UX-HAND target damage, explicit rejection and accepted retry
      specs: tests/e2e/arena-hand-sheet.spec.ts
      grep: 'lanzamiento con objetivo|rechazo explícito'
      artifact_name: failed-ux-hand-regressions

  target_handoff_drivers:
    name: Focused · handoff and board-driver games
    needs: [target_priority_sync, target_double_dispatch, target_ux_hand]
    uses: ./.github/workflows/e2e-regression.yml
    with:
      job_name: Touch, viewport, gameplay, deck and UI handoffs
      specs: |
        tests/e2e/arena-touch-play.spec.ts
        tests/e2e/arena-viewport-matrix.spec.ts
        tests/e2e/game.spec.ts
        tests/e2e/ui-deck-10e.spec.ts
        tests/e2e/ui-game.spec.ts
      grep: '390×844: la acción de la carta|320×800: la hoja más estrecha|tablet con la mesa llena|escritorio con la mesa llena|partida real: inicializa WASM|bloqueo real: asignar bloqueadora|la partida se juega hasta el final|partida completa y victoria|la interfaz explica objetivos|objetivo elegido con clic'
      artifact_name: failed-handoff-driver-regressions

  target_tutorial:
    name: Focused · deterministic tutorial transitions
    needs: [target_priority_sync, target_double_dispatch, target_ux_hand]
    uses: ./.github/workflows/e2e-regression.yml
    with:
      job_name: Tutorial preference override and seat transitions
      specs: tests/e2e/tutorial.spec.ts
      grep: 'la lección se completa|la lección se puede usar con teclado'
      artifact_name: failed-tutorial-regressions

  target_accessibility:
    name: Focused · Full Control persistence and phase-sheet Axe
    needs: [target_priority_sync, target_double_dispatch, target_ux_hand]
    uses: ./.github/workflows/e2e-regression.yml
    with:
      job_name: UX lab temporal preference and phase-sheet accessibility
      specs: tests/e2e/ux-lab.spec.ts
      grep: 'cromo de mesa nombra la prioridad|en el teléfono la ficha de fase'
      artifact_name: failed-accessibility-regressions

  browser:
    name: Chromium integration and visual interaction
    needs: [wasm, native-integration, target_handoff_drivers, target_tutorial, target_accessibility]
    runs-on: ubuntu-latest
    # GameScenario fixtures place Phase directly in the state each E2E needs;
    # the browser suite no longer plays through random draws to find a card.
    # UX-DECISION and UX-PRIORITY add motor-real transitions on top of the
    # measured baseline; the full serial suite exceeded 60 minutes before its
    # JSON summary and 28-test functional gate could complete. Give it headroom
    # without weakening the Playwright gate.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun --bun playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: mtg-engine-wasm
          path: static/wasm
      - uses: actions/download-artifact@v4
        with:
          name: mtg-engine-wasm-e2e
          path: static/wasm-e2e
      - uses: actions/download-artifact@v4
        with:
          name: e2e-scenario-fixtures
          path: static/e2e-scenarios
      - name: Verify isolated GameScenario artifacts
        run: |
          test -s static/wasm-e2e/mtg_engine_wasm_e2e.wasm
          for fixture in \
            target-cast manual-payment cancel-cast privacy-handoff \
            priority-empty priority-stack priority-auto-pass priority-low-use \
            priority-resolve-own opponent-turn-response \
            declare-attackers declare-blockers obligatory-decision optional-decision; do
            test -s "static/e2e-scenarios/$fixture.json"
          done
      # The JSON report feeds the annotation step below: the directory names
      # alone say which test broke, the message says why. `list` keeps the
      # readable console output.
      # UX-DECISION and UX-PRIORITY evidence run in their dedicated jobs. Their
      # markers are deliberately unique: a plain `EVIDENCIA` would also match
      # the arena-quality-gate titles and silently drop those contracts here.
      - run: bun --bun playwright test --reporter=list,json --grep-invert 'MESA_EVIDENCE_UX_(DECISION|PRIORITY)'
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/report.json
      # The job summary is the evidence and the gate: it publishes passed /
      # failed / skipped / retries plus the per-test rows of UX-HAND,
      # UX-DECISION and UX-PRIORITY, and fails when a required test was skipped.
      # A `test.skip` written inside a spec leaves the runner green, which is
      # exactly the hole the WASM guard cannot see (`docs/UX-HAND.md`, section G).
      - name: Publish Playwright summary and gate skipped required tests
        if: always()
        run: bun scripts/e2e-summary.ts
      # The HTML report, the traces and the job log live behind an artifact
      # download that some networks cannot reach; annotations are plain JSON on
      # the API, so every failure is repeated there with its error message.
      - name: Annotate failing Playwright tests
        if: always()
        run: bun scripts/e2e-annotations.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results
            docs/performance.json
          if-no-files-found: warn
          retention-days: 7

  ux-evidence:
    name: UX-DECISION baseline and result evidence
    needs: [static, wasm, native-integration]
    if: needs.static.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun --bun playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: mtg-engine-wasm
          path: static/wasm
      - uses: actions/download-artifact@v4
        with:
          name: mtg-engine-wasm-e2e
          path: static/wasm-e2e
      - uses: actions/download-artifact@v4
        with:
          name: e2e-scenario-fixtures
          path: static/e2e-scenarios
      - name: Prepare the fixed baseline worktree
        env:
          BASE_SHA: dd531f46d20b6136cb2b7a40962a210fad6a4de0
        run: |
          set -euo pipefail
          git rev-parse "$BASE_SHA^{commit}" >/dev/null 2>&1 || git fetch origin "$BASE_SHA" --depth=1
          git worktree add --detach /tmp/mesa-baseline "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/mesa-baseline/node_modules
          mkdir -p /tmp/mesa-baseline/static/wasm /tmp/mesa-baseline/static/wasm-e2e /tmp/mesa-baseline/static/e2e-scenarios
          cp -r static/wasm/. /tmp/mesa-baseline/static/wasm/
          cp -r static/wasm-e2e/. /tmp/mesa-baseline/static/wasm-e2e/
          cp -r static/e2e-scenarios/. /tmp/mesa-baseline/static/e2e-scenarios/
      - name: Measure baseline and result with one spec, one WASM and one fixture set
        env:
          BASE_SHA: dd531f46d20b6136cb2b7a40962a210fad6a4de0
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence/after" "$GITHUB_WORKSPACE/evidence/baseline"
          cd /tmp/mesa-baseline
          nohup bun run dev --port 5174 > /tmp/mesa-baseline-vite.log 2>&1 &
          cd "$GITHUB_WORKSPACE"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5174/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5174/ >/dev/null || { echo "::error::baseline dev server did not start"; tail -30 /tmp/mesa-baseline-vite.log; exit 1; }
          for variant in after baseline; do
            url=http://127.0.0.1:5173
            if [ "$variant" = baseline ]; then url=http://127.0.0.1:5174; fi
            echo "::group::evidence $variant ($url)"
            MESA_UI_VARIANT="$variant" \
            MESA_EVIDENCE_URL="$url" \
            MESA_EVIDENCE_SHA="$HEAD_SHA" \
            MESA_BASELINE_SHA="$BASE_SHA" \
            MESA_EVIDENCE_OUT="$GITHUB_WORKSPACE/evidence/$variant" \
              bun --bun playwright test tests/e2e/ux-decision-evidence.spec.ts --reporter=list --grep MESA_EVIDENCE_UX_DECISION 2>&1 | tee "/tmp/ux-evidence-$variant.log"
            echo "::endgroup::"
          done
          MESA_EVIDENCE_ROOT="$GITHUB_WORKSPACE/evidence" bun scripts/ux-decision-compare.ts 2>&1 | tee /tmp/ux-evidence-compare.log
      - name: Annotate UX evidence failures
        if: failure()
        run: |
          for f in /tmp/ux-evidence-after.log /tmp/ux-evidence-baseline.log /tmp/ux-evidence-compare.log /tmp/mesa-baseline-vite.log; do
            test ! -s "$f" && continue
            grep -E 'Error|error|failed|Failed|✘|✖|expect|Timeout|panic|no se montó|comparison gate' "$f" \
              | tail -20 | while IFS= read -r line; do echo "::error::$line"; done
          done
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ux-evidence-logs
          path: |
            /tmp/ux-evidence-*.log
            /tmp/mesa-baseline-vite.log
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-decision-evidence
          path: evidence
          if-no-files-found: warn
          retention-days: 14

  ux-priority-evidence:
    name: UX-PRIORITY evidence (three Phase modes and live responses)
    needs: [static, wasm, native-integration]
    if: needs.static.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun --bun playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: mtg-engine-wasm
          path: static/wasm
      - uses: actions/download-artifact@v4
        with:
          name: mtg-engine-wasm-e2e
          path: static/wasm-e2e
      - uses: actions/download-artifact@v4
        with:
          name: e2e-scenario-fixtures
          path: static/e2e-scenarios
      - name: Verify Phase artifacts and equivalent fixtures
        run: |
          test -s static/wasm/mtg_engine_wasm.wasm
          test -s static/wasm-e2e/mtg_engine_wasm_e2e.wasm
          test -s static/e2e-scenarios/priority-low-use.json
          test -s static/e2e-scenarios/priority-resolve-own.json
          test -s static/e2e-scenarios/priority-auto-pass.json
      - name: Execute UX-PRIORITY measurements in Chromium
        env:
          MESA_PRIORITY_EVIDENCE_OUT: evidence/priority
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/priority-report.json
        run: bun --bun playwright test tests/e2e/ux-priority-evidence.spec.ts --reporter=list,json --grep MESA_EVIDENCE_UX_PRIORITY
      - name: Annotate UX-PRIORITY E2E failures
        if: failure()
        run: bun scripts/e2e-annotations.ts test-results/priority-report.json
      - name: Compare measured modes and gate response/privacy/recovery contracts
        if: always()
        env:
          MESA_PRIORITY_EVIDENCE_FILE: evidence/priority/metrics.json
          MESA_PRIORITY_EVIDENCE_OUT: evidence/priority
        run: bun scripts/ux-priority-compare.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-priority-evidence
          path: |
            evidence/priority
            test-results
          if-no-files-found: warn
          retention-days: 14

  required-ci:
    name: Required CI gate
    if: always()
    needs:
      - static
      - wasm
      - native-integration
      - target_priority_sync
      - target_double_dispatch
      - target_ux_hand
      - target_handoff_drivers
      - target_tutorial
      - target_accessibility
      - browser
      - ux-evidence
      - ux-priority-evidence
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable validation job
        env:
          STATIC: ${{ needs.static.result }}
          HEAVY: ${{ needs.static.outputs.heavy }}
          WASM: ${{ needs.wasm.result }}
          NATIVE: ${{ needs.native-integration.result }}
          TARGET_PRIORITY_SYNC: ${{ needs.target_priority_sync.result }}
          TARGET_DOUBLE_DISPATCH: ${{ needs.target_double_dispatch.result }}
          TARGET_UX_HAND: ${{ needs.target_ux_hand.result }}
          TARGET_HANDOFF_DRIVERS: ${{ needs.target_handoff_drivers.result }}
          TARGET_TUTORIAL: ${{ needs.target_tutorial.result }}
          TARGET_ACCESSIBILITY: ${{ needs.target_accessibility.result }}
          BROWSER: ${{ needs.browser.result }}
          UX_DECISION: ${{ needs.ux-evidence.result }}
          UX_PRIORITY: ${{ needs.ux-priority-evidence.result }}
        run: |
          set -euo pipefail
          test "$STATIC" = success || { echo "static=$STATIC"; exit 1; }
          for status in "$WASM" "$NATIVE" "$TARGET_PRIORITY_SYNC" "$TARGET_DOUBLE_DISPATCH" "$TARGET_UX_HAND" \
            "$TARGET_HANDOFF_DRIVERS" "$TARGET_TUTORIAL" "$TARGET_ACCESSIBILITY" "$BROWSER" "$UX_DECISION" "$UX_PRIORITY"; do
            if [ "$HEAVY" = true ]; then
              test "$status" = success || { echo "heavy CI job did not pass: $status"; exit 1; }
            else
              case "$status" in
                success|skipped) ;;
                *) echo "unexpected CI result for a light diff: $status"; exit 1 ;;
              esac
            fi
          done
          echo "Required CI gate passed (heavy=$HEAVY)."
