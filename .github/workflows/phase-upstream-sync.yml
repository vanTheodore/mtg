name: Mesa upstream Phase import (pinned branch)
on:
  push:
    branches: [maintenance/phase-upstream-20261102]
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'vanTheodore/mtg'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-03-02
      - name: Import one pinned upstream Phase snapshot
        run: bash scripts/sync-phase-upstream.sh
