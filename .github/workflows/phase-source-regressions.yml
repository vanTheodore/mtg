# Run genuine Phase source regressions only when the pinned engine changes.
# Mesa's usual CI covers WASM, bridge parity and Chromium, but intentionally
# does not compile the thousands of upstream integration tests on every UI PR.
name: Phase source regressions
on:
  pull_request:
    paths:
      - 'crates/phase-engine/src/**'
      - 'crates/phase-engine/tests/integration/**'
      - 'crates/phase-parser/src/**'
      - 'docs/PHASE-UPSTREAM-PIN.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-rust:
    name: Ripple visibility and attacked-recipient Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUN_VERSION: '1.4.4'
      CARGO_TARGET_DIR: target-phase-regressions
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: '-Zcrate-attr=feature(if_let_guard) -Zcrate-attr=feature(let_chains) -Zthreads=1 -Zshare-generics -Zmir-opt-level=0'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-03-02
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target-phase-regressions'
          shared-key: mesa-phase-regressions
      - name: Supply the original pinned audit script required by a test binary
        run: |
          # Cargo also compiles Phase's auxiliary bins when building a test
          # target. One bin has compile-time include_bytes! for this wrapper.
          # The script is never executed or committed; hash-check its exact
          # upstream Git blob before compiling any Rust integration tests.
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            https://raw.githubusercontent.com/phase-rs/phase/d963d0a2379c8396e8ffff28c4df87ab8580559f/scripts/audit-resolution-face-casting.sh \
            -o scripts/audit-resolution-face-casting.sh
          test "$(git hash-object scripts/audit-resolution-face-casting.sh)" = \
            "39bd4a9d04bcdf4ca7ea81eb71dad6c21af5e069"
      - name: Assemble an isolated target from upstream's original tests
        run: |
          cat > crates/phase-engine/tests/mesa_phase_regressions.rs <<'RUST'
          // Do not run or copy every upstream integration shard for UI PRs.
          // Reuse real pinned upstream test code and fixtures with no duplicate rules.
          #[path = "integration/support.rs"]
          mod support;
          #[path = "integration/attacked_player_referent.rs"]
          mod attacked_player_referent;
          #[path = "integration/cast_during_resolution_pipeline.rs"]
          mod cast_during_resolution_pipeline;
          #[path = "integration/issue_10401_off_zone_ability_cost_reduction.rs"]
          mod off_zone_ability_cost_reduction;
          #[path = "integration/ignite_memories_random_reveal.rs"]
          mod ignite_memories_random_reveal;
          #[path = "integration/cast_undo_sparse_record.rs"]
          mod cast_undo_sparse_record;
          #[path = "integration/captain_america_throw.rs"]
          mod captain_america_throw;
          #[path = "integration/board_wipe_co_departure_scaling.rs"]
          mod board_wipe_co_departure_scaling;
          #[path = "integration/issue_8065_nightmare_shepherd.rs"]
          mod issue_8065_nightmare_shepherd;
          RUST
      - name: Assert the specific upstream regression tests are registered
        run: |
          set -o pipefail
          cargo test --locked -p phase-engine --test mesa_phase_regressions -- --list 2>&1 | tee /tmp/phase-tests.log > /tmp/mesa-phase-tests.txt
          for name in \
            nested_ripple_bottom_order_cards_are_visible_to_controller \
            ripple_cast_with_target_pause_keeps_bottom_pile_revealed \
            finished_ripple_with_stacked_hit_does_not_retain_later_reveal \
            ripple_free_cast_keeps_reveal_through_mana_ability_color_choice \
            hellrider_trigger_follows_the_triggering_attacker_not_the_attacking_source \
            animated_cavalcade_attacking_damages_what_the_triggering_creature_attacks \
            training_grounds_does_not_discount_a_graveyard_unearth \
            training_grounds_does_not_discount_hand_cycling \
            reveals_one_random_card_and_deals_its_mana_value \
            untapping_a_land_before_any_cost_payment_records_nothing_and_cancel_keeps_it_untapped \
            unattach_cost_rejects_two_attachments_for_one_slot \
            wrath_resolves_only_observers_that_left_with_a_trigger \
            copy_token_is_1_1_nightmare; do
            grep -Fq "$name: test" /tmp/mesa-phase-tests.txt || {
              echo "Missing required test: $name" >&2
              exit 1
            }
          done
      - name: Execute Ripple visibility, pause and cancellation regressions
        run: cargo test --locked -p phase-engine --test mesa_phase_regressions ripple -- --test-threads=1
      - name: Execute Hellrider trigger-recipient regressions
        run: cargo test --locked -p phase-engine --test mesa_phase_regressions hellrider -- --test-threads=1
      - name: Execute Cavalcade attack-recipient regressions
        run: cargo test --locked -p phase-engine --test mesa_phase_regressions cavalcade -- --test-threads=1

      - name: Execute original Training Grounds scope regressions
        run: cargo test --locked -p phase-engine --test mesa_phase_regressions off_zone_ability_cost_reduction -- --test-threads=1
      - name: Execute original Ignite Memories random reveal regressions
        run: cargo test --locked -p phase-engine --test mesa_phase_regressions ignite_memories_random_reveal -- --test-threads=1
      - name: Mana ability reversal during sparse cast-undo recording (original upstream test)
        run: cargo test --locked -p phase-engine --test mesa_phase_regressions cast_undo_sparse_record::untapping_a_land_before_any_cost_payment_records_nothing_and_cancel_keeps_it_untapped -- --exact --test-threads=1
      - name: Unattach cost rejects paying with two Equipment (original upstream test)
        run: cargo test --locked -p phase-engine --test mesa_phase_regressions captain_america_throw::unattach_cost_rejects_two_attachments_for_one_slot -- --exact --test-threads=1
      - name: Wrath of God co-departure triggers (original upstream test)
        run: cargo test --locked -p phase-engine --test mesa_phase_regressions board_wipe_co_departure_scaling -- --test-threads=1
      - name: Nightmare Shepherd copy exceptions (original upstream test)
        run: cargo test --locked -p phase-engine --test mesa_phase_regressions issue_8065_nightmare_shepherd -- --test-threads=1
      # UP-131: the eight mechanics the v0.131.0 pin changed. Each module below is
      # an ORIGINAL upstream test file, copied verbatim from the pinned tarball
      # (same names, same fixtures, no re-implementation), and every one of them
      # only depends on `support`, so they can share one target. This is a
      # SELECTED suite, not `cargo test -p phase-engine`: it covers the mechanics
      # the pin touched, and it says nothing about the 357 upstream modules Mesa
      # prunes on purpose.
      - name: Assemble the pinned-mechanics target from upstream's own tests
        run: |
          cat > crates/phase-engine/tests/mesa_phase_pin_mechanics.rs <<'RUST'
          // Selected coverage for the mechanics v0.131.0 changed. Original upstream
          // files, unmodified; see docs/PHASE-UPSTREAM-2026-11-23-31123E2B.md.
          #[path = "integration/support.rs"]
          mod support;
          // Lethal damage, trample and damage assignment (CR 120.6, 704.5g, 702.19b).
          #[path = "integration/trample_lethal_assigned_this_step.rs"]
          mod trample_lethal_assigned_this_step;
          #[path = "integration/zilortha_lethal_damage_by_power.rs"]
          mod zilortha_lethal_damage_by_power;
          // Simultaneous and sequential unless resolution (CR 101.4).
          #[path = "integration/scoped_unless_choose_all_then_act.rs"]
          mod scoped_unless_choose_all_then_act;
          #[path = "integration/scoped_unless_payer_per_iteration.rs"]
          mod scoped_unless_payer_per_iteration;
          #[path = "integration/issue_2916_torment_repeat_unless.rs"]
          mod issue_2916_torment_repeat_unless;
          // Non-token creatures that entered this turn (BattlefieldEntryRecord::token_status).
          #[path = "integration/bbfu10_entered_this_turn_snapshot.rs"]
          mod bbfu10_entered_this_turn_snapshot;
          // Ward and mana windows.
          #[path = "integration/compound_ward_cost_pays_every_part.rs"]
          mod compound_ward_cost_pays_every_part;
          // Referent identity across zone changes, plus Greater Gargadon while suspended
          // (the suspended-activation leg lives in mold_folk).
          #[path = "integration/mold_folk_sacrifice_type_union.rs"]
          mod mold_folk_sacrifice_type_union;
          // Past in Flames flashback.
          #[path = "integration/issue_8079_past_in_flames_flashback.rs"]
          mod issue_8079_past_in_flames_flashback;
          // Completed cycling history and its journal/ledger edits (CR 702.29).
          #[path = "integration/yidaro_cycle_publication.rs"]
          mod yidaro_cycle_publication;
          // Event-referent identity across zone changes (CR 400.7).
          #[path = "integration/event_referent_identity.rs"]
          mod event_referent_identity;
          // Round-trip determinism of the saved state, which this pin extends with
          // pending_simultaneous_unless and BattlefieldEntryRecord::token_status.
          #[path = "integration/deterministic_game_state_serde.rs"]
          mod deterministic_game_state_serde;
          RUST
      - name: Assert the pinned-mechanics modules compile and register their tests
        run: |
          set -o pipefail
          cargo test --locked -p phase-engine --test mesa_phase_pin_mechanics -- --list 2>&1 \
            | tee /tmp/pin-mechanics.log > /tmp/pin-mechanics.txt
          for name in \
            trample_lethal_assigned_this_step:: \
            zilortha_lethal_damage_by_power:: \
            scoped_unless_choose_all_then_act:: \
            scoped_unless_payer_per_iteration:: \
            issue_2916_torment_repeat_unless:: \
            bbfu10_entered_this_turn_snapshot:: \
            compound_ward_cost_pays_every_part:: \
            mold_folk_sacrifice_type_union:: \
            issue_8079_past_in_flames_flashback:: \
            yidaro_cycle_publication:: \
            event_referent_identity:: \
            deterministic_game_state_serde::; do
            grep -Fq "$name" /tmp/pin-mechanics.txt || {
              echo "Missing pinned-mechanics module: $name" >&2
              exit 1
            }
          done
          echo "registered: $(grep -c ': test' /tmp/pin-mechanics.txt) tests"
          # A filter that matches nothing still exits 0, so the two counting
          # modules are checked by number, not just by presence: 27 + 27 = 54.
          for module in yidaro_cycle_publication event_referent_identity; do
            found=$(grep -cE "^ *$module::" /tmp/pin-mechanics.txt || true)
            test "$found" -eq 27 || {
              echo "$module registered $found tests, expected 27" >&2
              exit 1
            }
          done
          found=$(grep -cE "^ *deterministic_game_state_serde::" /tmp/pin-mechanics.txt || true)
          test "$found" -eq 12 || {
            echo "deterministic_game_state_serde registered $found tests, expected 12" >&2
            exit 1
          }
      - name: Execute lethal damage, trample and damage assignment
        run: cargo test --locked -p phase-engine --test mesa_phase_pin_mechanics trample_lethal_assigned_this_step -- --test-threads=1
      - name: Execute Zilortha lethal-by-power
        run: cargo test --locked -p phase-engine --test mesa_phase_pin_mechanics zilortha_lethal_damage_by_power -- --test-threads=1
      - name: Execute simultaneous and sequential unless resolution
        run: |
          cargo test --locked -p phase-engine --test mesa_phase_pin_mechanics scoped_unless_choose_all_then_act -- --test-threads=1
          cargo test --locked -p phase-engine --test mesa_phase_pin_mechanics scoped_unless_payer_per_iteration -- --test-threads=1
          cargo test --locked -p phase-engine --test mesa_phase_pin_mechanics issue_2916_torment_repeat_unless -- --test-threads=1
      - name: Execute non-token entered-this-turn counting
        run: cargo test --locked -p phase-engine --test mesa_phase_pin_mechanics bbfu10_entered_this_turn_snapshot -- --test-threads=1
      - name: Execute ward and mana windows
        run: cargo test --locked -p phase-engine --test mesa_phase_pin_mechanics compound_ward_cost_pays_every_part -- --test-threads=1
      - name: Execute referent identity and suspended Greater Gargadon
        run: cargo test --locked -p phase-engine --test mesa_phase_pin_mechanics mold_folk_sacrifice_type_union -- --test-threads=1
      - name: Execute Past in Flames flashback
        run: cargo test --locked -p phase-engine --test mesa_phase_pin_mechanics issue_8079_past_in_flames_flashback -- --test-threads=1
      # No --exact: these are module prefixes. The count assertion above is what
      # proves the prefix is not an empty green no-op.
      - name: Execute completed cycling history
        run: cargo test --locked -p phase-engine --test mesa_phase_pin_mechanics yidaro_cycle_publication -- --test-threads=1
      - name: Execute event-referent identity across zone changes
        run: cargo test --locked -p phase-engine --test mesa_phase_pin_mechanics event_referent_identity -- --test-threads=1
      - name: Execute deterministic save/restore serialization regressions
        run: cargo test --locked -p phase-engine --test mesa_phase_pin_mechanics deterministic_game_state_serde -- --test-threads=1
      # UP-133: original integration modules added by the v0.133.0 pin
      # (31123e2b...e5368963, 60 commits). Every file below is copied verbatim
      # from the pinned tarball and needs only `support`, so they share one
      # target. This is a SELECTED suite, not the 357 upstream modules Mesa
      # prunes; it covers the mechanics this pin changed, including the two
      # wire-contract changes (up-to keepers, shared-team priority).
      - name: Assemble the UP-133 target from upstream's own tests
        run: |
          cat > crates/phase-engine/tests/mesa_phase_up133.rs <<'RUST'
          // Selected coverage for the mechanics v0.133.0 changed. Original upstream
          // files, unmodified; see docs/PHASE-UPSTREAM-2026-11-26-E5368963.md.
          #[path = "integration/support.rs"]
          mod support;
          // The HEAD fix: a required additional cost must not consume the cards
          // its own mana ability needs (CR 118.9d + CR 118.10).
          #[path = "integration/additional_cost_shared_mana_resource.rs"]
          mod additional_cost_shared_mana_resource;
          // "Up to" keepers: the WaitingFor floor Mesa's client now renders.
          #[path = "integration/keeper_up_to_cardinality.rs"]
          mod keeper_up_to_cardinality;
          // CR 106.7: what a departed permanent could produce (could_produce.rs).
          #[path = "integration/could_produce_mana_types.rs"]
          mod could_produce_mana_types;
          // Conditional "add ... instead" mana, Urza lands and typed carriers.
          #[path = "integration/conditional_instead_mana.rs"]
          mod conditional_instead_mana;
          // Firebender Ascension: observer-trigger copies and trigger ordering.
          #[path = "integration/issue_11338_observer_copies.rs"]
          mod issue_11338_observer_copies;
          // CR 805.5a/805.5b: shared-team seats act on team priority.
          #[path = "integration/two_headed_giant_teammate_priority.rs"]
          mod two_headed_giant_teammate_priority;
          // "An opponent is dealt damage by one or more creatures" fires once.
          #[path = "integration/lolth_emblem_recipient.rs"]
          mod lolth_emblem_recipient;
          // Station thresholds and charge-counter loss.
          #[path = "integration/planet_station_thresholds.rs"]
          mod planet_station_thresholds;
          // Tyvar the Bellicose: counters on a mana ability's resolution.
          #[path = "integration/tyvar_the_bellicose_mana_counters.rs"]
          mod tyvar_the_bellicose_mana_counters;
          // Death by Dragons: "each player other than target" scope.
          #[path = "integration/death_by_dragons.rs"]
          mod death_by_dragons;
          RUST
      - name: Assert the UP-133 modules compile and register their tests
        run: |
          set -o pipefail
          cargo test --locked -p phase-engine --test mesa_phase_up133 -- --list 2>&1 \
            | tee /tmp/up133-list.log > /tmp/up133-list.txt
          for module in \
            additional_cost_shared_mana_resource \
            keeper_up_to_cardinality \
            could_produce_mana_types \
            conditional_instead_mana \
            issue_11338_observer_copies \
            two_headed_giant_teammate_priority \
            lolth_emblem_recipient \
            planet_station_thresholds \
            tyvar_the_bellicose_mana_counters \
            death_by_dragons; do
            grep -Fq "$module::" /tmp/up133-list.txt || {
              echo "Missing UP-133 module: $module" >&2
              exit 1
            }
          done
          registered=$(grep -c ': test' /tmp/up133-list.txt || true)
          echo "registered: $registered tests"
          # A filter that matches nothing still exits 0: prove the suite is real.
          test "$registered" -ge 150 || {
            echo "UP-133 registered only $registered tests, expected at least 150" >&2
            exit 1
          }
      - name: Execute the UP-133 pinned-mechanics regressions
        run: cargo test --locked -p phase-engine --test mesa_phase_up133 -- --test-threads=1
      # The job log lives behind a blob download that is unreachable on some
      # networks; annotations are plain JSON on api.github.com.
      - name: Annotate Rust errors
        if: failure()
        run: bun scripts/rust-annotations.ts /tmp/phase-tests.log
