name: Mesa one-time Phase arena artwork import
on:
  push:
    branches: [ui/arena-svelte-first-pass-20261102]
    paths:
      - .github/workflows/arena-artwork-import.yml
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'vanTheodore/mtg'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Import and verify five pinned Phase paintings
        run: bash scripts/import-phase-arena-art.sh
