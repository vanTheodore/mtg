# Dependabot supports Bun 1.4 and the text bun.lock file. It regenerates the
# lockfile itself; never update just package.json with frozen CI installs.
# Deliberately no Cargo updates: Phase source is vendored + SHA-pinned, and
# Cargo.lock must be reviewed with that upstream pin and WASM/parity tests.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:30"
      timezone: "America/Santiago"
    open-pull-requests-limit: 2
    rebase-strategy: "disabled"
    groups:
      svelte-stack:
        patterns:
          - "@sveltejs/*"
          - "svelte"
          - "svelte-check"
        update-types: ["patch", "minor"]
      tooling:
        patterns: ["*"]
        exclude-patterns:
          - "@sveltejs/*"
          - "svelte"
          - "svelte-check"
        update-types: ["patch", "minor"]
    ignore:
      # TypeScript 7 and any future major require a separate, reviewed
      # migration. This repository intentionally targets TypeScript 6.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
