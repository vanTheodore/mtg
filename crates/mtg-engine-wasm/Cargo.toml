[package]
name = "mtg-engine-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Test-only transport operation for restoring a Phase GameScenario into a browser E2E.
e2e-scenarios = []
# Native fixture generator only; never enabled by either WASM build.
e2e-scenario-generator = ["engine/test-support"]

[dependencies]
engine = { path = "../phase-engine", package = "phase-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = "0.3"

[[bin]]
name = "catalog"
path = "src/bin/catalog.rs"

[[bin]]
name = "parity"
path = "src/bin/parity.rs"

[[bin]]
name = "scenarios"
path = "src/bin/scenarios.rs"

[[bin]]
name = "e2e_scenarios"
path = "src/bin/e2e_scenarios.rs"
required-features = ["e2e-scenario-generator"]
