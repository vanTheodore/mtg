[package]
name = "phase-engine"
version = "0.119.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A Magic: The Gathering rules engine implementing the Comprehensive Rules for native and WASM."
repository = "https://github.com/phase-rs/phase"
homepage = "https://github.com/phase-rs/phase"
documentation = "https://github.com/phase-rs/phase"

[lib]
name = "engine"

[features]
default = []
cli = []
audit = []
forge = []
proptest = []
test-support = []
interaction-bindings = []
combo-verify = [
    "test-support",
]

[dependencies]
serde_ignored = "0.1"
thiserror = "2"
rand = "0.9"
rand_chacha = "0.9"
petgraph = "0.6"
toml = "0.8"
nom = "8.0"
serde_json = "1"
sha2 = "0.10"
web-time = "1"
rustc-hash = "2"

[dependencies.serde]
version = "1"
features = [
    "derive",
    "rc",
]

[dependencies.tracing]
version = "0.1"

[dependencies.indexmap]
version = "2"
features = [
    "serde",
]

[dependencies.strum]
version = "0.27"
features = [
    "derive",
]

[dependencies.im]
version = "15"
features = [
    "serde",
]

[dependencies.smallvec]
version = "1"
features = [
    "serde",
    "union",
]

[target."cfg(windows)".dependencies]
same-file = "1"

[build-dependencies]
toml = "0.8"
serde_json = "1"
