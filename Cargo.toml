[workspace]
resolver = "2"
members = ["crates/phase-engine", "crates/mtg-engine-wasm"]

[workspace.package]
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2021"

[profile.release]
opt-level = "z"
lto = false
codegen-units = 16
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = 0
incremental = false
